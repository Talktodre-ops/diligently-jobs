name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "e2e/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "e2e/**", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Browser test types
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
