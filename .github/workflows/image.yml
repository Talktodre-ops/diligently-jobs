name: image

# Builds the production image Railway deploys and boots it against a throwaway
# Postgres, so a Dockerfile, build or startup break fails here first. With
# "Wait for CI" on in Railway, a failed run on main stops that commit from
# deploying.

on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "backend/**", "web/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "backend/**", "web/**", ".github/workflows/image.yml"]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: diligently:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot it, migrate, and serve the API and the app
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 -e COOKIE_SECURE=false \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci \
            -e R2_ENDPOINT=http://127.0.0.1:9 -e R2_BUCKET=ci -e R2_ACCESS_KEY_ID=ci -e R2_SECRET_ACCESS_KEY=ci \
            diligently:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/applications/any | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^cache-control: no-store'
      - name: Server log
        if: always()
        run: docker logs app || true
