[package]
name = "diligently-api"
version = "0.1.0"
edition = "2021"
description = "Diligently — backend service for persistent audit log, blob storage, and sync."
license = "MIT"
publish = false

[[bin]]
name = "diligently-api"
path = "src/main.rs"

[dependencies]
# HTTP + async runtime
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# R2 / S3-compatible blob storage
# Defaults off: the SDKs' default "rustls" feature is the legacy hyper 0.14
# client on rustls 0.21 (open advisories). default-https-client uses the
# current stack. Credentials are passed explicitly, so no SSO or process
# credential providers.
aws-config       = { version = "1.5", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3       = { version = "1.55", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "http-1x"] }
aws-credential-types = "1.2"

# Serde + error handling
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1.0"
anyhow     = "1.0"

# IDs + time
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

# Config
dotenvy = "0.15"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# DOCX rendering for ATS-friendly CV exports.
docx-rs = "0.4"

# Scratch directory for tectonic LaTeX compile (writes cv.tex + reads cv.pdf).
tempfile = "3"

# Templating engine for the LaTeX CV template. Tera uses {{ }} / {% %}
# delimiters which don't collide with LaTeX's single-{ syntax.
tera = "1"

# LLM client for the async ATS scoring job (OpenAI-compatible /chat/completions).
# rustls (not native-tls) to avoid a system OpenSSL dependency, matching sqlx.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
http-body-util = "0.1.5"
lopdf = "0.47.0"
tokio   = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
