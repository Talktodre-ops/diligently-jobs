<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#B5401C}a:hover{color:#3B1C32}
input:focus{outline: 2px solid #E8603C; outline-offset: 1px; border-color: #3B1C32}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FCF8EC; color: #3B1C32; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="padding: 12px 12px 0;">
    <a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #3B1C32;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 24px 32px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em;">Create your account</h1>
      <p style="margin: 0; font-size: 15px; color: #6B4E62;">Takes a minute. Your CV comes next.</p>
    </div>

    <a href="VerifyEmail.dc.html" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #D9CCAE; background: #FFFFFF; color: #3B1C32; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Continue with Google</a>

    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #6B4E62;">
      <span style="flex: 1; height: 1px; background: #EADFC2;"></span>or with email<span style="flex: 1; height: 1px; background: #EADFC2;"></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="su-name" style="font-size: 13px; font-weight: 600;">Full name</label>
      <input id="su-name" type="text" autocomplete="name" value="Ada Okafor" style="height: 52px; box-sizing: border-box; border: 1.5px solid #D9CCAE; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 16px Inter, sans-serif; color: #3B1C32;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="su-email" style="font-size: 13px; font-weight: 600;">Email</label>
      <input id="su-email" type="email" autocomplete="email" value="ada@example.com" style="height: 52px; box-sizing: border-box; border: 1.5px solid #D9CCAE; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 16px Inter, sans-serif; color: #3B1C32;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="su-pw" style="font-size: 13px; font-weight: 600;">Password</label>
      <div style="position: relative;">
        <input id="su-pw" type="{{ pwType }}" autocomplete="new-password" placeholder="At least 12 characters" onInput="{{ onPw }}" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #D9CCAE; border-radius: 12px; background: #FFFFFF; padding: 0 64px 0 14px; font: 16px Inter, sans-serif; color: #3B1C32;">
        <button type="button" onClick="{{ toggleShow }}" style="position: absolute; right: 4px; top: 4px; height: 44px; padding: 0 12px; border: 0; background: transparent; color: #B5401C; font: 600 13px Inter, sans-serif; cursor: pointer;">{{ showLabel }}</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="flex: 1; height: 4px; border-radius: 999px; background: #EADFC2; overflow: hidden;"><div style="height: 4px; width: {{ pwPct }}; background: {{ pwColor }}; border-radius: 999px;"></div></div>
        <span style="font-size: 12px; color: #6B4E62; min-width: 108px; text-align: right;">{{ pwHint }}</span>
      </div>
    </div>

    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: #5E4456;">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 1px 0 0; accent-color: #3B1C32;">
      <span>I agree to the <a href="#">Terms</a> and the <a href="#">Privacy Policy</a>.</span>
    </label>

    <a href="VerifyEmail.dc.html" style="height: 54px; border-radius: 999px; background: #C2471F; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Create account</a>

    <p style="margin: 0; text-align: center; font-size: 14px; color: #6B4E62;">Already have an account? <a href="SignIn.dc.html" style="font-weight: 600;">Sign in</a></p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const len = (s.pw || '').length;
    const ok = len >= 12;
    return {
      pwType: s.show ? 'text' : 'password',
      showLabel: s.show ? 'Hide' : 'Show',
      toggleShow: () => this.setState({ show: !s.show }),
      onPw: (e) => this.setState({ pw: e.target.value }),
      pwPct: Math.min(100, Math.round((len / 12) * 100)) + '%',
      pwColor: ok ? '#3B1C32' : '#E8603C',
      pwHint: len === 0 ? '12 characters min' : (ok ? 'Good length' : (12 - len) + ' more to go')
    };
  }
}
</script>
</body>
</html>
