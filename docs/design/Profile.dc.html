<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#B5401C}a:hover{color:#3B1C32}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FCF8EC; color: #3B1C32; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="padding: 20px 12px 8px 20px; display: flex; align-items: center; justify-content: space-between;">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 30px; letter-spacing: -0.015em;">Profile</h1>
    <a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #3B1C32;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 64px; height: 64px; border-radius: 999px; background: #3B1C32; color: #F6E7A6; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600;">AO</div>
      <div>
        <div style="font-size: 18px; font-weight: 600;">Ada Okafor</div>
        <div style="font-size: 14px; color: #6B4E62;">Senior Backend Engineer · Lagos</div>
      </div>
    </div>

    <section aria-label="Master CV" style="background: #F6E7A6; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div>
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;">Master CV</div>
        <div style="font-size: 14px; color: #5E4456; margin-top: 4px; line-height: 1.45;">Every tailored CV starts here. Edits here never change CVs you already sent.</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <a href="CvPreview.dc.html" style="flex: 1; height: 44px; border-radius: 999px; background: #3B1C32; color: #F6E7A6; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">View</a>
        <a href="OnboardUpload.dc.html" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #3B1C32; color: #3B1C32; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Upload new</a>
      </div>
    </section>

    <section aria-label="Sections" style="background: #FFFFFF; border: 1px solid #EADFC2; border-radius: 16px;">
      <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="5">
        <div style="border-bottom: 1px solid {{ sec.line }};">
          <button type="button" onClick="{{ sec.toggle }}" aria-expanded="{{ sec.open }}" style="width: 100%; min-height: 56px; border: 0; background: transparent; padding: 0 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: Inter, sans-serif; color: #3B1C32; text-align: left;">
            <span style="flex: 1; font-size: 15px; font-weight: 600;">{{ sec.label }}</span>
            <span style="font-size: 13px; color: #6B4E62;">{{ sec.count }}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{ sec.rot }}; transition: transform 150ms;"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{ sec.open }}" hint-placeholder-val="{{ false }}">
            <ul style="margin: 0; padding: 0 16px 14px 32px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; color: #5E4456;">
              <sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="2">
                <li>{{ it }}</li>
              </sc-for>
            </ul>
          </sc-if>
        </div>
      </sc-for>
    </section>

    <section aria-label="What you are looking for" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B4E62;">Looking for</h2>
        <a href="OnboardTargets.dc.html" style="font-size: 13px; font-weight: 600;">Edit</a>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EADFC2; font-size: 13px; font-weight: 600;">Backend Engineer</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EADFC2; font-size: 13px; font-weight: 600;">Platform Engineer</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EADFC2; font-size: 13px; font-weight: 600;">Remote or hybrid</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #EADFC2; font-size: 13px; font-weight: 600;">A4</span>
      </div>
    </section>
  </main>

  <dc-import name="TabBar" active="profile" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const open = (this.state && this.state.open) || 'Experience';
    const defs = [
      { label: 'Experience', count: '3 roles', items: ['Northfold · Senior Backend Engineer · 2021 to present', 'Quarry Labs · Backend Engineer · 2018 to 2021', 'Kestrel · Software Engineer · 2016 to 2018'] },
      { label: 'Education', count: '1', items: ['University of Lagos · B.Sc. Computer Science'] },
      { label: 'Skills', count: '18', items: ['Go, Rust, Python, SQL', 'Postgres, Kafka, Redis, Kubernetes, Terraform'] },
      { label: 'Projects', count: '2', items: ['Open-source rate limiter for Go services', 'Talk: running on-call for small teams'] },
      { label: 'Contact', count: '4', items: ['ada@example.com', 'linkedin.com/in/ada · github.com/ada'] }
    ];
    return {
      sections: defs.map((d, i) => Object.assign({}, d, {
        open: open === d.label,
        rot: open === d.label ? 'rotate(180deg)' : 'rotate(0deg)',
        toggle: () => this.setState({ open: open === d.label ? null : d.label }),
        line: i === defs.length - 1 ? 'transparent' : '#EADFC2'
      }))
    };
  }
}
</script>
</body>
</html>
