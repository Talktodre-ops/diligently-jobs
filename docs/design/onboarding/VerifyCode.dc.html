<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter your code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#B5401C}a:hover{color:#3B1C32}
input:focus{outline:2px solid #C2471F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #FCF8EC; color: #3B1C32; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 0; display: flex; align-items: center;">
    <a href="SignUp.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: #3B1C32;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </div>

  <main style="flex: 1; padding: 12px 24px 0; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em;">Check your email</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E4456;">We sent a 6-digit code to <strong style="color: #3B1C32;">ada@example.com</strong>. Type it here and keep going. The link in the email works too.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="code" style="font-size: 14px; font-weight: 600;">Code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" value="{{ code }}" onChange="{{ onCode }}" style="height: 64px; box-sizing: border-box; border-radius: 16px; border: 1.5px solid {{ border }}; background: #FFFFFF; padding: 0 20px; font: 600 30px Inter, sans-serif; letter-spacing: 0.5em; color: #3B1C32; text-align: center;">
      <sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #3B1C32;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2471F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          Verified. On to your CV.
        </div>
      </sc-if>
      <sc-if value="{{ notOk }}" hint-placeholder-val="{{ true }}">
        <div style="font-size: 13px; color: #6B4E62;">Type any six digits to try it.</div>
      </sc-if>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <a href="#gmail" style="height: 48px; border-radius: 999px; border: 1.5px solid #D9CCAE; background: #FFFFFF; color: #3B1C32; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Open Gmail</a>
      <a href="#outlook" style="height: 48px; border-radius: 999px; border: 1.5px solid #D9CCAE; background: #FFFFFF; color: #3B1C32; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Open Outlook</a>
    </div>

    <div style="font-size: 14px; color: #5E4456; line-height: 1.6;">
      Nothing yet? <button type="button" style="border: 0; background: none; padding: 0; font: 600 14px Inter, sans-serif; color: #B5401C; cursor: pointer;">Send a new code</button> in 0:42<br>
      Wrong address? <a href="SignUp.dc.html" style="font-weight: 600;">Change it</a>
    </div>
  </main>

  <footer style="padding: 12px 24px 32px;">
    <sc-if value="{{ ok }}" hint-placeholder-val="{{ false }}">
      <a href="Upload.dc.html" style="height: 54px; border-radius: 999px; background: #C2471F; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Continue</a>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const code = (this.state && this.state.code) || '';
    const ok = code.length === 6;
    return {
      code,
      ok,
      notOk: !ok,
      border: ok ? '#3B1C32' : '#D9CCAE',
      onCode: (e) => this.setState({ code: String(e.target.value || '').replace(/\D/g, '').slice(0, 6) })
    };
  }
}
</script>
</body>
</html>
