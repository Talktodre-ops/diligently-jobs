<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review rewrites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#B5401C}a:hover{color:#3B1C32}
textarea:focus{outline: 2px solid #E8603C; outline-offset: 1px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FCF8EC; color: #3B1C32; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px;">
    <a href="Workspace.dc.html" aria-label="Back to application" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #3B1C32;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0;">
      <div style="font-size: 13px; color: #6B4E62;">Halcyon Health</div>
      <div style="font-size: 16px; font-weight: 600;">Review rewrites</div>
    </div>
    <div aria-label="Current match" style="padding: 6px 12px; border-radius: 999px; background: #3B1C32; color: #F6E7A6; font-size: 14px; font-weight: 600; margin-right: 8px;">Match {{ score }}</div>
  </header>

  <sc-if value="{{ reviewing }}" hint-placeholder-val="{{ true }}">
    <main style="flex: 1; overflow-y: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 26px; letter-spacing: -0.015em;">{{ remainingLabel }}</h1>
        <span style="font-size: 13px; color: #6B4E62;">7 accepted automatically</span>
      </div>

      <section aria-label="{{ cur.where }}" style="background: #FFFFFF; border: 1px solid #EADFC2; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B4E62;">{{ cur.where }}</div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 12px; font-weight: 600; color: #6B4E62;">Original</div>
          <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B4E62;">{{ cur.original }}</p>
        </div>
        <div style="height: 1px; background: #EADFC2;"></div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 12px; font-weight: 600; color: #B5401C;">{{ rewriteLabel }}</div>
            <sc-if value="{{ notEditing }}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{ startEdit }}" style="height: 36px; padding: 0 10px; border: 0; background: transparent; color: #B5401C; font: 600 13px Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Edit
              </button>
            </sc-if>
          </div>
          <sc-if value="{{ notEditing }}" hint-placeholder-val="{{ true }}">
            <p style="margin: 0; font-size: 16px; line-height: 1.55;">
              <sc-for list="{{ segs }}" as="sg" hint-placeholder-count="3">
                <sc-if value="{{ sg.k }}" hint-placeholder-val="{{ false }}"><mark style="background: #F6E7A6; color: #3B1C32; padding: 0 3px; border-radius: 3px;">{{ sg.t }}</mark></sc-if>
                <sc-if value="{{ sg.p }}" hint-placeholder-val="{{ true }}"><span>{{ sg.t }}</span></sc-if>
              </sc-for>
            </p>
          </sc-if>
          <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
            <label for="edit" style="position: absolute; left: -9999px;">Edit rewrite</label>
            <textarea id="edit" rows="4" value="{{ draft }}" onInput="{{ onDraft }}" style="resize: none; box-sizing: border-box; width: 100%; border: 1.5px solid #3B1C32; border-radius: 12px; background: #FFFDF6; padding: 10px 12px; font: 16px/1.5 Inter, sans-serif; color: #3B1C32;"></textarea>
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
              <button type="button" onClick="{{ cancelEdit }}" style="height: 40px; padding: 0 14px; border: 0; background: transparent; color: #3B1C32; font: 600 14px Inter, sans-serif; cursor: pointer;">Cancel</button>
              <button type="button" onClick="{{ saveEdit }}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #3B1C32; color: #F6E7A6; font: 600 14px Inter, sans-serif; cursor: pointer;">Save</button>
            </div>
          </sc-if>
        </div>
        <div style="display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #FCF8EC; font-size: 13px; line-height: 1.45; color: #5E4456;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
          <span>{{ cur.why }}</span>
        </div>
      </section>
    </main>
    <footer style="padding: 12px 20px 32px; border-top: 1px solid #EADFC2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button type="button" onClick="{{ keep }}" style="height: 54px; border-radius: 999px; border: 1.5px solid #3B1C32; background: transparent; color: #3B1C32; font: 600 15px Inter, sans-serif; cursor: pointer;">Keep original</button>
      <button type="button" onClick="{{ accept }}" style="height: 54px; border-radius: 999px; border: 0; background: #C2471F; color: #FFFFFF; font: 600 15px Inter, sans-serif; cursor: pointer;">Use rewrite</button>
    </footer>
  </sc-if>

  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <main style="flex: 1; padding: 32px 24px 16px; display: flex; flex-direction: column; gap: 18px;">
      <div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 20px; background: #F6E7A6; display: flex; align-items: center; justify-content: center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3B1C32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
      </div>
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em;">All reviewed</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5E4456;">{{ summary }}</p>
      <button type="button" onClick="{{ restart }}" style="align-self: flex-start; height: 40px; padding: 0; border: 0; background: transparent; color: #B5401C; font: 600 14px Inter, sans-serif; cursor: pointer;">Go through them again</button>
    </main>
    <footer style="padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 10px;">
      <a href="CvPreview.dc.html" style="height: 54px; border-radius: 999px; background: #C2471F; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Preview CV</a>
      <a href="Workspace.dc.html" style="height: 54px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #3B1C32; color: #3B1C32; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Back to application</a>
    </footer>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const items = [
      { where: 'Northfold · Experience', original: 'Was part of the on-call rotation for the payments team.',
        segs: [{ t: 'Ran the ' }, { t: 'on-call', k: true }, { t: ' rotation for six engineers and wrote the ' }, { t: 'incident review', k: true }, { t: ' process.' }],
        why: 'The job asks you to lead on-call and run incident reviews. The six engineers come from your master CV.', gain: 3 },
      { where: 'Quarry Labs · Experience', original: 'Helped move batch jobs to a queue.',
        segs: [{ t: 'Moved batch jobs to ' }, { t: 'Postgres', k: true }, { t: '-backed queues with ' }, { t: 'idempotent retries', k: true }, { t: '.' }],
        why: 'Halcyon runs on Postgres and cares about reliable data pipelines.', gain: 3 }
    ];
    const idx = s.idx || 0;
    const decisions = s.decisions || [];
    const done = idx >= items.length;
    const cur = items[Math.min(idx, items.length - 1)];
    const edits = s.edits || {};
    const edited = edits[idx];
    const plain = cur.segs.map((x) => x.t).join('');
    const segs = edited != null ? [{ t: edited, p: true }] : cur.segs.map((x) => ({ t: x.t, k: !!x.k, p: !x.k }));
    const score = 80 + decisions.reduce((a, d, i) => a + (d === 'accept' ? items[i].gain : 0), 0);
    const decide = (d) => () => this.setState({ idx: idx + 1, decisions: decisions.concat([d]), editing: false });
    const accepted = decisions.filter((d) => d === 'accept').length;
    const left = items.length - idx;
    return {
      reviewing: !done, done: done,
      cur: cur, segs: segs, score: score,
      remainingLabel: left === 1 ? '1 left to review' : left + ' left to review',
      rewriteLabel: edited != null ? 'Your edit' : 'Rewrite',
      editing: !!s.editing, notEditing: !s.editing,
      draft: s.draft != null ? s.draft : (edited != null ? edited : plain),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      startEdit: () => this.setState({ editing: true, draft: edited != null ? edited : plain }),
      cancelEdit: () => this.setState({ editing: false, draft: null }),
      saveEdit: () => this.setState({ editing: false, edits: Object.assign({}, edits, { [idx]: s.draft != null ? s.draft : plain }), draft: null }),
      accept: decide('accept'),
      keep: decide('keep'),
      restart: () => this.setState({ idx: 0, decisions: [], edits: {}, editing: false, draft: null }),
      summary: 'You used ' + accepted + ' of ' + items.length + ' rewrites. Your match is ' + score + '. Your master CV is unchanged.'
    };
  }
}
</script>
</body>
</html>
