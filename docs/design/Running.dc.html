<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Working on your application</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#B5401C}a:hover{color:#3B1C32}
@keyframes dl-spin{to{transform:rotate(360deg)}}
@keyframes dl-pulse{0%,100%{opacity:1}50%{opacity:0.45}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FCF8EC; color: #3B1C32; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 4px 20px;">
    <div style="font-size: 13px; color: #6B4E62;">Halcyon Health · Senior Backend Engineer</div>
    <a href="Home.dc.html" aria-label="Close and keep working in the background" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #3B1C32;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <main style="flex: 1; padding: 12px 24px 16px; display: flex; flex-direction: column; gap: 26px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em;">{{ title }}</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E4456;">{{ subtitle }}</p>
    </div>

    <ol aria-label="Progress" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
      <sc-for list="{{ steps }}" as="st" hint-placeholder-count="5">
        <li style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; min-height: 64px;">
          <div style="display: flex; flex-direction: column; align-items: center;">
            <sc-if value="{{ st.done }}" hint-placeholder-val="{{ false }}">
              <span style="width: 28px; height: 28px; border-radius: 999px; background: #3B1C32; display: inline-flex; align-items: center; justify-content: center; flex: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F6E7A6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
            </sc-if>
            <sc-if value="{{ st.active }}" hint-placeholder-val="{{ false }}">
              <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 999px; border: 3px solid #EADFC2; border-top-color: #E8603C; animation: dl-spin 0.9s linear infinite; flex: none;"></span>
            </sc-if>
            <sc-if value="{{ st.pending }}" hint-placeholder-val="{{ true }}">
              <span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 999px; border: 2px solid #D9CCAE; flex: none;"></span>
            </sc-if>
            <sc-if value="{{ st.notLast }}" hint-placeholder-val="{{ true }}">
              <span style="flex: 1; width: 2px; background: {{ st.line }}; margin: 4px 0;"></span>
            </sc-if>
          </div>
          <div style="padding-top: 3px; padding-bottom: 16px;">
            <div style="font-size: 15px; font-weight: 600; color: {{ st.color }};">{{ st.label }}</div>
            <sc-if value="{{ st.showDetail }}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 13px; color: #6B4E62; margin-top: 2px;">{{ st.detail }}</div>
            </sc-if>
          </div>
        </li>
      </sc-for>
    </ol>
  </main>

  <footer style="padding: 12px 24px 32px; display: flex; flex-direction: column; gap: 12px;">
    <sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
      <a href="Workspace.dc.html" style="height: 54px; border-radius: 999px; background: #C2471F; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
        See your application
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </sc-if>
    <sc-if value="{{ working }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #F6E7A6; font-size: 14px; line-height: 1.45;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B1C32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        <span>You can close this. We will notify you when it is ready.</span>
      </div>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.setState({ i: 0 });
    this.timer = setInterval(() => {
      const i = (this.state && this.state.i) || 0;
      if (i >= 5) clearInterval(this.timer);
      else this.setState({ i: i + 1 });
    }, 1300);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const i = (this.state && this.state.i) || 0;
    const defs = [
      { label: 'Reading the job description', detail: '14 requirements found' },
      { label: 'Researching Halcyon Health', detail: '6 sources, Series B, health claims' },
      { label: 'Matching your experience', detail: 'Starting match: 54' },
      { label: 'Tailoring your CV', detail: '9 bullets rewritten, nothing invented' },
      { label: 'Scoring and drafting your letter', detail: 'New match: 86' }
    ];
    const steps = defs.map((d, k) => {
      const done = k < i, active = k === i;
      return Object.assign({}, d, {
        done: done, active: active, pending: k > i,
        notLast: k < defs.length - 1,
        showDetail: done,
        line: done ? '#3B1C32' : '#EADFC2',
        color: k > i ? '#6B4E62' : '#3B1C32'
      });
    });
    const finished = i >= 5;
    return {
      steps: steps,
      finished: finished,
      working: !finished,
      title: finished ? 'Ready.' : 'Working on it',
      subtitle: finished ? 'Your match went from 54 to 86. Two rewrites are waiting for your call.' : 'Usually under a minute. Every change is checked against your master CV.'
    };
  }
}
</script>
</body>
</html>
