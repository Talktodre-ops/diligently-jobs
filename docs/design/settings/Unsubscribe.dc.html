<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unsubscribed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#B5401C}a:hover{color:#3B1C32}
button:focus-visible,a:focus-visible{outline:2px solid #C2471F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCF8EC; color: #3B1C32; font-family: Inter, system-ui, sans-serif; padding: 28px 24px 32px; display: flex; flex-direction: column; gap: 28px;">
  <div style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; letter-spacing: -0.02em;">diligently<span style="color: #E8603C;">.</span></div>
  <main style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px;">
    <sc-if value="{{ off }}" hint-placeholder-val="{{ true }}">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.08;">No more Monday summaries.</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #5E4456;">Done for ada.okafor@gmail.com. Follow-up reminders and everything else stay as they were.</p>
      <button type="button" onClick="{{ flip }}" style="align-self: flex-start; height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid #D9CCAE; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #3B1C32; cursor: pointer;">Undo</button>
    </sc-if>
    <sc-if value="{{ on }}" hint-placeholder-val="{{ false }}">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.08;">Monday summaries are back on.</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #5E4456;">The next one arrives on Monday morning.</p>
    </sc-if>
  </main>
  <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5E4456;">No sign-in needed for this page. To change other emails, <a href="SettingsPhone.dc.html" style="font-weight: 600;">open Settings</a>.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const back = !!(this.state && this.state.back);
    return { off: !back, on: back, flip: () => this.setState({ back: true }) };
  }
}
</script>
</body>
</html>
