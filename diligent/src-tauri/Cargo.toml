[package]
name = "diligently_app"
version = "0.1.4"
description = "Diligently — a privacy-first desktop AI copilot for job applications, interviews, and meetings."
authors = ["ANDERSON Victor (@Talktodre-ops)"]
license = "UNLICENSED"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "interview-copilot"]
categories = ["gui", "multimedia", "accessibility", "science"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is required so the lib name doesn't collide with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "diligently_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "diligently"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv = "0.15"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2.5.2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
dotenv = "0.15"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tauri-plugin-shell = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
] }
